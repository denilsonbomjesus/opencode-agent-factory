name: AI Factory Dispatch

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, labeled]
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  mark-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Apply queue label on command
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.comment && context.payload.comment.body || '').trim();
            const issue = context.payload.issue;
            const shouldQueue = body === '/bot-run' || context.payload.action === 'opened' || context.payload.label?.name === 'ai-run';
            if (!shouldQueue || !issue) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['ai-run']
            });
