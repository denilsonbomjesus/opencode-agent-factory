services:
  opencode-factory:
    image: node:20-bookworm-slim
    container_name: opencode_ai_jail
    restart: unless-stopped
    working_dir: /factory
    env_file:
      - .env
    environment:
      FACTORY_ROOT: /factory
      WORKSPACE_ROOT: /workspace
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LOCAL_OPENAI_BASE_URL: ${LOCAL_OPENAI_BASE_URL:-}
      LOCAL_OPENAI_API_KEY: ${LOCAL_OPENAI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./:/factory
      - ${WORKSPACE_ROOT:-$HOME/workspace}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    command: >-
      bash -lc "apt-get update && apt-get install -y git curl jq unzip zip python3 python3-venv make gcc g++ &&
      npm install -g ${OPENCODE_NPM_PACKAGE:-opencode-ai@latest} || true &&
      npm install && tail -f /dev/null"
